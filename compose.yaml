services:
  db:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: talent
      POSTGRES_DB: talent
      POSTGRES_PASSWORD: ${TALENT_DB_PASSWORD:?Set TALENT_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent -d talent"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    image: ${COMPOSE_PROJECT_NAME:-talent-engine}-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      TALENT_DATABASE_URL: postgresql+psycopg://talent:${TALENT_DB_PASSWORD}@db:5432/talent
      TALENT_PUBLIC_ORIGIN: ${TALENT_PUBLIC_ORIGIN:-http://localhost:3003}
      TALENT_UPLOAD_DIRECTORY: /app/private-uploads
      TALENT_LOCAL_DEVELOPMENT: 'true'
      TALENT_CSRF_SECRET: ${TALENT_CSRF_SECRET:?Set TALENT_CSRF_SECRET in .env}
    volumes:
      - private_uploads:/app/private-uploads
    ports:
      - "127.0.0.1:${TALENT_API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  worker:
    logging:
      driver: "none"
    image: ${COMPOSE_PROJECT_NAME:-talent-engine}-api
    environment:
      TALENT_DATABASE_URL: postgresql+psycopg://talent:${TALENT_DB_PASSWORD}@db:5432/talent
      TALENT_PUBLIC_ORIGIN: ${TALENT_PUBLIC_ORIGIN:-http://localhost:3003}
      TALENT_LOCAL_DEVELOPMENT: 'true'
      TALENT_CSRF_SECRET: ${TALENT_CSRF_SECRET:?Set TALENT_CSRF_SECRET in .env}
      TALENT_LOG_DIRECTORY: /app/private-logs
      TALENT_UPLOAD_DIRECTORY: /app/private-uploads
    volumes:
      - private_uploads:/app/private-uploads
      - technical_logs:/app/private-logs
    command: ["python", "-m", "talent_engine.analyses.worker"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  migrate:
    image: ${COMPOSE_PROJECT_NAME:-talent-engine}-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      TALENT_DATABASE_URL: postgresql+psycopg://talent:${TALENT_DB_PASSWORD}@db:5432/talent
    command: ["alembic", "upgrade", "head"]
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
  seed-access:
    image: ${COMPOSE_PROJECT_NAME:-talent-engine}-api
    environment:
      TALENT_DATABASE_URL: postgresql+psycopg://talent:${TALENT_DB_PASSWORD}@db:5432/talent
      TALENT_REVIEWER_LOGIN: ${TALENT_REVIEWER_LOGIN:-}
      TALENT_REVIEWER_PASSWORD: ${TALENT_REVIEWER_PASSWORD:-}
    command: ["python", "-m", "talent_engine.seed_access"]
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
  web:
    environment:
      TALENT_API_ORIGIN: http://api:8000
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${TALENT_WEB_PORT:-3003}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  private_uploads:
  technical_logs:
