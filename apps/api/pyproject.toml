[project]
name = "talent-engine-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.142,<0.143", "uvicorn>=0.40,<1", "pydantic-settings>=2,<3", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3,<4", "alembic>=1,<2"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talent_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
